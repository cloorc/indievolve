 <text x="430" y="1035" text-anchor="middle" font-size="9" fill="#606266">九服务共同读写；kp-svc 的 concept/concept_leaf_map、item-svc 的 item_pool 是本次集成的写入落点</text>

 <rect x="800" y="1001" width="920" height="50" rx="6" fill="#ffffff" stroke="#13c2c2"/>
 <text x="1260" y="1019" text-anchor="middle" font-size="10" font-weight="bold" fill="#08979c">PostgreSQL（底座侧）dbname=asset_foundation，schema=knowledge/item_bank/semantic/governance/release/ai_ops/read_model</text>
 <text x="1260" y="1035" text-anchor="middle" font-size="9" fill="#606266">引擎侧任何进程都不直连此库——只经 HTTP API + 本地 SQLite catalog 中转，物理隔离是设计前提</text>

