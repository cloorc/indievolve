 <text x="900" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">自适应学习引擎（早期主线）运行时权威进程视图 —— 含 education-data-foundation 真实集成</text>
 <text x="900" y="50" text-anchor="middle" font-size="11.5" fill="#606266">这是 education-data-foundation 实际对接的运行时环境：自适应学习引擎/engine/（早期主线），非全量实验室-v2</text>
 <text x="900" y="68" text-anchor="middle" font-size="10" font-style="italic" fill="#c0392b">⚠ 与此前发布的"全量实验室-v2 运行时进程图"是两个独立环境——两套 engine/ 代码几乎相同(同源分叉)但互不相通，v2 未接入本页展示的数据底座</text>

 <!-- ================= education-data-foundation (独立仓库/独立服务) ================= -->
 <rect x="40" y="88" width="1700" height="150" rx="8" fill="#e6fffb" stroke="#13c2c2" stroke-width="1.5"/>
 <text x="60" y="108" font-size="11.5" font-weight="bold" fill="#08979c">education-data-foundation/（独立仓库 · 独立部署 · github.com/IndievolveLabs/platform-data-foundation-service）</text>

 <rect x="80" y="118" width="420" height="105" rx="6" fill="#ffffff" stroke="#13c2c2"/>
 <text x="290" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">education-data-foundation :8820</text>
 <text x="290" y="155" text-anchor="middle" font-size="9" fill="#606266">src/education_data_foundation/app.py</text>
 <text x="290" y="171" text-anchor="middle" font-size="9" fill="#606266">FastAPI 单体 + 独立 PostgreSQL（asset_foundation 库）</text>
 <text x="290" y="187" text-anchor="middle" font-size="9" fill="#606266">仅监听 127.0.0.1，公司 HTTPS 经 foundation-api.indievolve.com</text>
 <text x="290" y="204" text-anchor="middle" font-size="8.5" fill="#909399">manifest/product-bundle/catalog 系列只读 API，Bearer Token 鉴权</text>

 <rect x="520" y="118" width="480" height="105" rx="6" fill="#ffffff" stroke="#13c2c2"/>
 <text x="760" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">consumer_sdk/catalogs.py（客户端库，非独立进程）</text>
 <text x="760" y="155" text-anchor="middle" font-size="9" fill="#606266">src/education_data_foundation/consumer_sdk/catalogs.py</text>
 <text x="760" y="171" text-anchor="middle" font-size="9" fill="#606266">CatalogInstaller + FoundationHttpTransport</text>
 <text x="760" y="187" text-anchor="middle" font-size="9" fill="#606266">下载并校验 3 个 catalog（ETag/SHA-256/血缘），原子安装为本地 SQLite</text>
 <text x="760" y="204" text-anchor="middle" font-size="8.5" fill="#909399">固定 bundle_hash=b9af41060d2a...，禁查询 implicit latest</text>

 <rect x="1020" y="118" width="700" height="105" rx="6" fill="#fffbe6" stroke="#e6a23c"/>
 <text x="1370" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#ad6800">固定产品包（不可变数据资产，本地已安装的 SQLite 文件）</text>
 <text x="1370" y="155" text-anchor="middle" font-size="9" fill="#606266">base_catalog（题库+知识库，128.3万题/7.6万知识资产）+ intelligence_catalog（质量/派生标签）</text>
 <text x="1370" y="171" text-anchor="middle" font-size="9" fill="#606266">+ curriculum_alignment_catalog（课标对齐，1140条款/5411候选）</text>
 <text x="1370" y="187" text-anchor="middle" font-size="9" fill="#606266">bundle_hash=b9af41060d2a0674e4f86f297d0bc5a72ecc5baacde18de797d661e9d9317acd</text>
 <text x="1370" y="204" text-anchor="middle" font-size="8.5" fill="#909399">product_use_ready=true，但 formal_release=false / rights_cleared=false（如实保留候选语义）</text>

 <line x1="500" y1="170" x2="520" y2="170" stroke="#13c2c2" stroke-width="1.5" marker-end="url(#arrteal)"/>
 <line x1="1000" y1="170" x2="1020" y2="170" stroke="#13c2c2" stroke-width="1.5" marker-end="url(#arrteal)"/>

 <!-- ================= 离线适配器（真实集成落点，非常驻进程） ================= -->
 <rect x="40" y="258" width="1700" height="120" rx="8" fill="#fff7e6" stroke="#e6a23c" stroke-width="1.5" stroke-dasharray="4 3"/>
 <text x="60" y="280" font-size="11.5" font-weight="bold" fill="#ad6800">离线批处理适配器 —— 真实集成落点，命令行工具，非常驻进程，事件触发式运行（灰度上线/回滚时手动执行）</text>
 <rect x="80" y="290" width="1660" height="76" rx="6" fill="#ffffff" stroke="#e6a23c"/>
 <text x="910" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f2d3d">engine/pipelines/load_foundation_pilot_pool.py（分支 feat/mvp-teacher-add-student，commit 96b596a，已合入 feat/pilot-paper-rehearsal 主干）</text>
 <text x="910" y="326" text-anchor="middle" font-size="9" fill="#606266">输入：本地已安装的 3 个 SQLite catalog 文件路径 + --pool-version + --schema + --apply</text>
 <text x="910" y="342" text-anchor="middle" font-size="9" fill="#606266">处理：知识点三段映射（公司UUID → concept_leaf_map.leaf_ref=MAT-* → 引擎concept_id）+ 题目准入门禁过滤（数学/精确挂载/可判分/难度已知/canonical/无匿名图片）</text>
 <text x="910" y="358" text-anchor="middle" font-size="9" fill="#909399">输出：调用引擎自己的 kp-svc/item-svc HTTP API 写入新 pool_version（不可变，同版本禁覆盖）；不直连 education-data-foundation 的 PostgreSQL，不让学生热路径依赖底座 API</text>

