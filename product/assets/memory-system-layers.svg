  <text x="1181" y="924" text-anchor="middle" font-size="10" fill="#606266">学校级教学质量趋势叙述</text>
  <text x="1181" y="942" text-anchor="middle" font-size="9" fill="#909399">（低优先级，P3）</text>

  <rect x="1334" y="880" width="276" height="100" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="1472" y="904" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">学生</text>
  <text x="1472" y="924" text-anchor="middle" font-size="10" fill="#606266">成长报告文案个性化</text>
  <text x="1472" y="942" text-anchor="middle" font-size="9" fill="#909399">（/student/exams 报告）</text>

