  <text x="599" y="924" text-anchor="middle" font-size="10" fill="#606266">跨学生批阅抽检提示</text>
  <text x="599" y="942" text-anchor="middle" font-size="9" fill="#909399">（可选，P2）</text>

  <rect x="752" y="880" width="276" height="100" rx="6" fill="#f4f4f5" stroke="#909399"/>
