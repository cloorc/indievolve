  <text x="890" y="924" text-anchor="middle" font-size="10" fill="#606266">班级学情叙述摘要</text>
  <text x="890" y="942" text-anchor="middle" font-size="9" fill="#909399">（提分模块，未来）</text>

  <rect x="1043" y="880" width="276" height="100" rx="6" fill="#f4f4f5" stroke="#909399"/>
