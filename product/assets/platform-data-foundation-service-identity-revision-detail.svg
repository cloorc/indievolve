<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1150">
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="1150" fill="#ffffff"/>

  <text x="750" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">第④步细节：单事务内的身份解析 + 内容版本化决策</text>
  <text x="750" y="58" text-anchor="middle" font-size="13.5" fill="#6b7280">对每一条待导入记录（题目 / 知识点 / 课标条款）都跑同一套判定 —— P0_2Importer</text>

  <!-- Start -->
  <rect x="600" y="86" width="300" height="46" rx="10" fill="#111827"/>
  <text x="750" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">拿到一条外部记录 (external_object_id)</text>
  <line x1="750" y1="132" x2="750" y2="164" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step A: advisory lock -->
  <rect x="560" y="166" width="380" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="750" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">pg_advisory_xact_lock(source_system+type+external_id)</text>
  <text x="750" y="207" text-anchor="middle" font-size="11.5" fill="#6b7280">防止并发导入给同一外部对象分配两个不同UUID</text>
  <line x1="750" y1="218" x2="750" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Decision 1: external_identifier exists? -->
  <polygon points="750,252 900,300 750,348 600,300" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="750" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">external_identifier</text>
  <text x="750" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">表里已有绑定？</text>

  <!-- YES branch -->
  <line x1="900" y1="300" x2="1000" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="925" y="290" font-size="12" fill="#059669" font-weight="700">是</text>
  <rect x="1000" y="264" width="380" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="1190" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">deleted_at 是否为空？</text>
  <text x="1190" y="307" text-anchor="middle" font-size="11.5" fill="#065f46">空 → 直接复用已绑定的旧 UUID</text>
  <text x="1190" y="324" text-anchor="middle" font-size="11.5" fill="#dc2626">非空 → 报错，要求人工对账</text>

  <!-- NO branch -->
  <line x1="600" y1="300" x2="500" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="555" y="290" font-size="12" fill="#374151" font-weight="700">否</text>
  <rect x="140" y="264" width="360" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="320" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">bootstrap_company_id()</text>
  <text x="320" y="306" text-anchor="middle" font-size="11.5" fill="#1e40af">uuid5(命名空间, domain|source|type|id)</text>
  <text x="320" y="323" text-anchor="middle" font-size="11.5" fill="#1e40af">INSERT identity + INSERT external_identifier</text>

  <!-- merge point -->
  <line x1="320" y1="336" x2="320" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="1190" y1="336" x2="1190" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="320" y1="400" x2="1190" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="750" y1="400" x2="750" y2="432" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <circle cx="750" cy="400" r="4" fill="#374151"/>

  <text x="750" y="425" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">→ 得到该外部对象对应的公司内部 UUID（identity_id）</text>

  <!-- Step: source_snapshot -->
  <rect x="530" y="440" width="440" height="70" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.8"/>
  <text x="750" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#86198f">写 governance.source_snapshot</text>
  <text x="750" y="483" text-anchor="middle" font-size="11.5" fill="#701a75">content_hash = sha256(payload) 作唯一键</text>
  <text x="750" y="500" text-anchor="middle" font-size="11.5" fill="#701a75">ON CONFLICT(...,content_hash) DO NOTHING（同内容天然幂等）</text>
  <line x1="750" y1="510" x2="750" y2="542" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step: compute content hash -->
  <rect x="530" y="544" width="440" height="56" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="750" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">按 RFC8785 canonical JSON 规范化内容</text>
  <text x="750" y="587" text-anchor="middle" font-size="11.5" fill="#6b7280">content_hash = SHA-256(canonical_json)</text>
  <line x1="750" y1="600" x2="750" y2="632" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Decision 2: content hash already exists for this identity? -->
  <polygon points="750,634 940,690 750,746 560,690" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="750" y="680" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">该 identity_id 下已存在</text>
  <text x="750" y="699" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">相同 content_hash 的 revision？</text>

  <!-- YES: reuse -->
  <line x1="940" y1="690" x2="1060" y2="690" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="985" y="680" font-size="12" fill="#059669" font-weight="700">是</text>
  <rect x="1060" y="655" width="380" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="1250" y="680" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">内容没变 —— 复用已有 revision</text>
  <text x="1250" y="699" text-anchor="middle" font-size="11.5" fill="#065f46">返回既有 revision_id / revision_number</text>
  <text x="1250" y="716" text-anchor="middle" font-size="11.5" fill="#065f46">不新增任何行（is_created=false）</text>

  <!-- NO: new revision -->
  <line x1="560" y1="690" x2="440" y2="690" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="500" y="680" font-size="12" fill="#374151" font-weight="700">否</text>
  <rect x="60" y="655" width="380" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="250" y="678" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">内容变了 —— 追加新 revision</text>
  <text x="250" y="696" text-anchor="middle" font-size="11.5" fill="#1e40af">revision_number = MAX(现有)+1</text>
  <text x="250" y="713" text-anchor="middle" font-size="11.5" fill="#1e40af">INSERT 新行（旧 revision 原样保留，</text>
  <text x="250" y="730" text-anchor="middle" font-size="11.5" fill="#1e40af">绝不 UPDATE / DELETE）</text>

  <!-- merge -->
  <line x1="250" y1="745" x2="250" y2="800" stroke="#374151" stroke-width="2"/>
  <line x1="1250" y1="727" x2="1250" y2="800" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="800" x2="1250" y2="800" stroke="#374151" stroke-width="2"/>
  <line x1="750" y1="800" x2="750" y2="832" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <circle cx="750" cy="800" r="4" fill="#374151"/>

  <!-- Final: commit -->
  <rect x="480" y="840" width="540" height="90" rx="12" fill="#0f172a"/>
  <text x="750" y="868" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">该条记录处理完成，纳入本次事务</text>
  <text x="750" y="890" text-anchor="middle" font-size="12" fill="#cbd5e1">整批记录跑完 → 校验外部ID集合未漂移 → COMMIT</text>
  <text x="750" y="908" text-anchor="middle" font-size="12" fill="#fca5a5">任一环节报错 → 整个事务 ROLLBACK，数据库状态不变</text>

  <!-- legend -->
  <rect x="60" y="970" width="1380" height="150" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="90" y="1000" font-size="14" font-weight="700" fill="#111827">关键不变量</text>
  <text x="90" y="1026" font-size="12.5" fill="#374151">• 身份稳定：一旦 external_identifier 绑定成功，之后同一外部ID永远解析到同一个公司UUID（除非人工显式改绑）</text>
  <text x="90" y="1050" font-size="12.5" fill="#374151">• 内容去重：相同 content_hash 永远复用同一 revision，不产生冗余版本；不同内容永远追加新 revision，旧版本永不丢失</text>
  <text x="90" y="1074" font-size="12.5" fill="#374151">• Append-only：knowledge_revision / item_revision 没有 UPDATE 语句，触发器 protect_stable_identity 在数据库层强制拒绝修改</text>
  <text x="90" y="1098" font-size="12.5" fill="#374151">• 漂移即拒：这批导入的外部ID全集必须与库中已有全集完全一致，多一个或少一个都会在事务里报错并整批回滚</text>
</svg>
