<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1060" viewBox="0 0 1650 1060" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#303133"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6852a"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9254de"/>
    </marker>
  </defs>

  <text x="825" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2d3d">共享记忆的组织层级传导规则</text>
  <text x="825" y="49" text-anchor="middle" font-size="11" fill="#909399">教育类记忆逐级广播（学校 → 学科组 → 备课组 → 任课教师）；班主任跨学科横向广播；学生记忆严格点对点、不进入本体系</text>

  <!-- L0 bracket -->
  <rect x="110" y="68" width="1020" height="112" rx="8" fill="none" stroke="#c0c4cc" stroke-dasharray="5 4"/>
  <text x="122" y="84" font-size="11" font-weight="bold" fill="#909399">L0 学校层（全校广播）</text>

  <rect x="140" y="92" width="300" height="70" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <text x="290" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">校长</text>
  <text x="290" y="140" text-anchor="middle" font-size="9.5" fill="#606266">教学质量目标·评价导向</text>

  <rect x="470" y="92" width="300" height="70" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <text x="620" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">主管理员</text>
  <text x="620" y="140" text-anchor="middle" font-size="9.5" fill="#606266">全校阅卷模式策略·权限配置</text>

  <rect x="800" y="92" width="300" height="70" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <text x="950" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">教务主任</text>
  <text x="950" y="140" text-anchor="middle" font-size="9.5" fill="#606266">校本库审核流程·考试安排规范</text>

  <!-- L0 -> bus -> L1 -->
  <path d="M620,162 V190" fill="none" stroke="#303133" stroke-width="1.5"/>
  <path d="M290,190 H1310" fill="none" stroke="#303133" stroke-width="1.5"/>
  <path d="M290,190 V220" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M800,190 V220" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M1310,190 V220" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- L1 bracket -->
  <rect x="30" y="205" width="1590" height="130" rx="8" fill="none" stroke="#c0c4cc" stroke-dasharray="5 4"/>
  <text x="42" y="221" font-size="11" font-weight="bold" fill="#909399">L1 学科组层（教研组长 → 按学科广播，学科间互不可见）</text>

  <rect x="60" y="220" width="460" height="100" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="290" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">语文教研组长</text>
  <text x="290" y="270" text-anchor="middle" font-size="10" fill="#1f6fb5">广播 → 全体语文任课教师</text>
  <text x="290" y="288" text-anchor="middle" font-size="9.5" fill="#606266">学科评分标准基线·薄弱知识点汇总</text>

  <rect x="570" y="220" width="460" height="100" rx="6" fill="#f4f4f5" stroke="#c0c4cc" stroke-dasharray="4 3"/>
  <text x="800" y="255" text-anchor="middle" font-size="12" fill="#909399">…其他学科教研组长</text>
  <text x="800" y="275" text-anchor="middle" font-size="10" fill="#909399">（数学/物理/生物等，机制相同，图示从略）</text>

  <rect x="1080" y="220" width="460" height="100" rx="6" fill="#ecf5ff" stroke="#e6a23c" stroke-width="2"/>
  <text x="1310" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">化学教研组长</text>
  <text x="1310" y="270" text-anchor="middle" font-size="10" fill="#1f6fb5">广播 → 全体化学任课教师</text>
  <text x="1310" y="288" text-anchor="middle" font-size="9.5" fill="#ad6800">本示例向下继续展开 ↓</text>

  <!-- L1 -> L2 -->
  <path d="M1310,320 V350" fill="none" stroke="#303133" stroke-width="1.5"/>
  <path d="M1215,350 H1405" fill="none" stroke="#303133" stroke-width="1.5"/>
  <path d="M1215,350 V380" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>
  <path d="M1405,350 V380" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- L2 bracket -->
  <rect x="1100" y="365" width="440" height="125" rx="8" fill="none" stroke="#c0c4cc" stroke-dasharray="5 4"/>
  <text x="1112" y="381" font-size="10.5" font-weight="bold" fill="#909399">L2 备课组层（按 年级×学科 广播）</text>

  <rect x="1130" y="395" width="170" height="80" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="1215" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">高一化学备课组长</text>
  <text x="1215" y="438" text-anchor="middle" font-size="9" fill="#1f6fb5">→ 高一化学任课教师</text>
  <text x="1215" y="454" text-anchor="middle" font-size="8.5" fill="#606266">年级教学进度·统一命题范围</text>

  <rect x="1320" y="395" width="170" height="80" rx="6" fill="#f4f4f5" stroke="#c0c4cc" stroke-dasharray="4 3"/>
  <text x="1405" y="420" text-anchor="middle" font-size="10" fill="#909399">高二/高三</text>
  <text x="1405" y="436" text-anchor="middle" font-size="10" fill="#909399">化学备课组长</text>
  <text x="1405" y="454" text-anchor="middle" font-size="8.5" fill="#909399">（机制相同）</text>

  <!-- L2 -> L3 -->
  <path d="M1215,475 V505" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- L3 行：语文任课教师 / 班主任 / 高一化学任课教师 三者同排对齐；已移除"本班任课教师集合"抽象层，班主任直接连到具体教师 -->
  <rect x="30" y="500" width="1590" height="150" rx="8" fill="none" stroke="#c0c4cc" stroke-dasharray="5 4"/>
  <text x="42" y="516" font-size="10.5" font-weight="bold" fill="#909399">L3 任课教师层（学科纵向继承+本地覆盖，不回传）＋ 班主任（跨学科横向广播，同排示意，非纵向继承）</text>

  <rect x="60" y="520" width="460" height="115" rx="6" fill="#f4f4f5" stroke="#c0c4cc" stroke-dasharray="4 3"/>
  <text x="290" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#909399">语文任课教师（个人）</text>
  <text x="290" y="570" text-anchor="middle" font-size="9.5" fill="#909399">继承语文教研组长广播的教育类记忆</text>
  <text x="290" y="588" text-anchor="middle" font-size="9.5" fill="#909399">— 机制与右侧化学示例相同，图示从略</text>

  <rect x="700" y="520" width="350" height="115" rx="6" fill="#fff3e0" stroke="#e6852a"/>
  <text x="875" y="543" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2d3d">班主任</text>
  <text x="875" y="562" text-anchor="middle" font-size="9" fill="#ad4e00">跨学科横向广播 → 本班全体任课教师</text>
  <text x="875" y="579" text-anchor="middle" font-size="9" fill="#606266">内容：班级聚合学情趋势·管理注意事项</text>
  <text x="875" y="596" text-anchor="middle" font-size="9" fill="#c0392b">⚠ 不含任何学生个体画像</text>
  <text x="875" y="613" text-anchor="middle" font-size="8.5" fill="#909399">直接广播给具体任课教师，不经过任何集合层</text>

  <rect x="1090" y="520" width="250" height="115" rx="6" fill="#f3e8ff" stroke="#9254de"/>
  <text x="1215" y="543" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f2d3d">高一化学任课教师（个人）</text>
  <text x="1215" y="562" text-anchor="middle" font-size="9" fill="#606266">继承 L0+L1+L2 教育类记忆默认值</text>
  <text x="1215" y="579" text-anchor="middle" font-size="9" fill="#606266">可本地微调评分细则/评语</text>
  <text x="1215" y="596" text-anchor="middle" font-size="9" fill="#606266">微调仅本人生效，不回传上层</text>
  <text x="1215" y="613" text-anchor="middle" font-size="8.5" fill="#909399">另有个人偏好记忆（私有，见 §7）</text>

  <!-- 班主任 直接横向广播给左右两侧具体任课教师实例（不再经过"本班任课教师集合"） -->
  <path d="M700,577 H520" fill="none" stroke="#e6852a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
  <path d="M1050,577 H1090" fill="none" stroke="#e6852a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrO)"/>

  <!-- 学生记忆：拆分为"学业记忆"与"教育相关个人偏好"两个子项，二者均可服务教育目的，仅走点对点通道 -->
  <rect x="1120" y="680" width="440" height="140" rx="6" fill="#fef0f0" stroke="#d43f3f" stroke-width="2"/>
  <text x="1340" y="703" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">学生记忆（学生本人，两个子项）</text>
  <text x="1340" y="721" text-anchor="middle" font-size="9.5" fill="#606266">① 学业记忆：学科×知识点×错误频次·历史成绩趋势</text>
  <text x="1340" y="737" text-anchor="middle" font-size="9.5" fill="#606266">② 学习偏好：学习节奏·练习风格（教育相关，供教学参考）</text>
  <text x="1340" y="753" text-anchor="middle" font-size="9.5" fill="#606266">两者均仅供该生任课教师按 student_id 点对点查询</text>
  <text x="1340" y="769" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b">🚫 不广播·不聚合·不缓存进教师记忆·他人不可查看</text>
  <text x="1340" y="787" text-anchor="middle" font-size="8.5" fill="#909399">（与左侧班主任广播体系无连接 — 刻意设计）</text>

  <!-- purple dotted point-query arrow from student memory up to chemistry teacher：终点精确落在教师方框底边界上 -->
  <path d="M1340,680 V635" fill="none" stroke="#9254de" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrP)"/>
  <text x="1350" y="663" font-size="8.5" fill="#9254de">按 student_id 点查</text>
  <text x="1350" y="676" font-size="8.5" fill="#9254de">（单次请求，不缓存）</text>

  <!-- override rule note -->
  <rect x="60" y="850" width="1530" height="95" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="825" y="872" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f2d3d">默认值继承与本地覆盖规则</text>
  <text x="825" y="892" text-anchor="middle" font-size="9.5" fill="#606266">下层可在上级广播的默认值基础上本地微调（如任课教师微调评分细则宽严），微调结果仅本人可见，不回传影响上级或同级其他成员；</text>
  <text x="825" y="910" text-anchor="middle" font-size="9.5" fill="#606266">上级更新默认值时，未做过本地微调的下级自动同步新版本；已微调的下级保留本地版本，可自行选择是否手动同步最新默认值。</text>
  <text x="825" y="930" text-anchor="middle" font-size="9.5" fill="#c0392b">学生记忆不适用本规则——它没有"默认值"概念，只有点对点服务，不参与任何继承/覆盖/同步。</text>

  <!-- legend -->
  <path d="M60,975 H100" fill="none" stroke="#303133" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="108" y="979" font-size="9.5" fill="#606266">教育类记忆单向广播（学校→学科组→备课组→任课教师，逐级默认值继承）</text>

  <path d="M60,1000 H100" fill="none" stroke="#e6852a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
  <text x="108" y="1004" font-size="9.5" fill="#606266">班主任跨学科横向广播（直连本班具体任课教师，仅聚合信息，不含学生个体）</text>

  <path d="M60,1025 H100" fill="none" stroke="#9254de" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrP)"/>
  <text x="108" y="1029" font-size="9.5" fill="#606266">学生记忆点对点读取（学业记忆+学习偏好，单次请求，不进入广播/继承体系）</text>

  <rect x="1000" y="968" width="24" height="14" fill="#f4f4f5" stroke="#c0c4cc" stroke-dasharray="4 3"/>
  <text x="1034" y="979" font-size="9.5" fill="#606266">同级其他分支（机制相同，图示从略）</text>

  <rect x="1000" y="993" width="24" height="14" fill="#fef0f0" stroke="#d43f3f" stroke-width="2"/>
  <text x="1034" y="1004" font-size="9.5" fill="#606266">学生记忆隔离区（严格不共享）</text>
</svg>
