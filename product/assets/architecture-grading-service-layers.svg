<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="975" viewBox="0 0 1470 975" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#606266"/>
    </marker>
  </defs>

  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">批阅服务分层架构（aireview-grading-service）</text>
  <text x="700" y="56" text-anchor="middle" font-size="12" fill="#909399">单代码库三角色运行（role=all/master/worker）；依赖方向自上而下：接口 → 编排 → Agent/队列 → 适配 → 存储与外部</text>

  <!-- 行标签：统一 x=30，基线对齐各行方框纵向中心 -->
  <text x="30" y="136" font-size="13" font-weight="bold" fill="#909399">接入层</text>
  <text x="30" y="266" font-size="13" font-weight="bold" fill="#909399">接口层</text>
  <text x="30" y="396" font-size="13" font-weight="bold" fill="#909399">编排层</text>
  <text x="30" y="526" font-size="13" font-weight="bold" fill="#909399">Agent 层</text>
  <text x="30" y="656" font-size="13" font-weight="bold" fill="#909399">队列层</text>
  <text x="30" y="786" font-size="13" font-weight="bold" fill="#909399">适配层</text>
  <text x="30" y="916" font-size="13" font-weight="bold" fill="#909399">存储与外部</text>

  <!-- 右侧依赖方向总箭头 -->
  <line x1="1400" y1="110" x2="1400" y2="918" stroke="#c0c4cc" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1400" y="96" text-anchor="middle" font-size="10" fill="#909399">依赖方向</text>

  <!-- 接入层：行 y=100..164 -->
  <rect x="160" y="100" width="340" height="64" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <text x="330" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a00">main.py · FastAPI 应用</text>
  <text x="330" y="146" text-anchor="middle" font-size="10" fill="#8a5a00">lifespan 启动编排 + 中间件 + 全局异常</text>

  <rect x="540" y="100" width="340" height="64" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <text x="710" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a00">server_role 三角色</text>
  <text x="710" y="146" text-anchor="middle" font-size="10" fill="#8a5a00">all(API+Worker) · master(纯API) · worker(纯计算)</text>

  <rect x="920" y="100" width="340" height="64" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <text x="1090" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a00">capacity.py 容量模型</text>
  <text x="1090" y="146" text-anchor="middle" font-size="10" fill="#8a5a00">线程池 · fd · 连接池启动自检（防 Errno 24）</text>

  <!-- 接口层：行 y=230..294 -->
  <rect x="160" y="230" width="340" height="64" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="330" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6fb5">api/routes/exam.py</text>
  <text x="330" y="276" text-anchor="middle" font-size="10" fill="#1f6fb5">建考 · 题目提取 · 预计算 · 预切割试卷提交</text>

  <rect x="540" y="230" width="340" height="64" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="710" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6fb5">api/routes/paper.py · task.py</text>
  <text x="710" y="276" text-anchor="middle" font-size="10" fill="#1f6fb5">整卷结果轮询 · 任务管理 · 重算重试</text>

  <rect x="920" y="230" width="340" height="64" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="1090" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6fb5">治理路由 ×15</text>
  <text x="1090" y="276" text-anchor="middle" font-size="10" fill="#1f6fb5">dashboard · config · samples · 复核门户 · 对外结算等</text>

  <!-- 编排层：行 y=360..424 -->
  <rect x="160" y="360" width="340" height="64" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="330" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b1f">paper_pipeline.py 整卷管道</text>
  <text x="330" y="406" text-anchor="middle" font-size="10" fill="#3d6b1f">区域映射 → 投子任务 → Pub/Sub 等待 → 汇聚</text>

  <rect x="540" y="360" width="340" height="64" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="710" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b1f">grading_service.py 编排器</text>
  <text x="710" y="406" text-anchor="middle" font-size="10" fill="#3d6b1f">主观题：缓存 → 提取 → 评分 → 验证 → 决策</text>

  <rect x="920" y="360" width="340" height="64" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="1090" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b1f">rubric_optimizer.py</text>
  <text x="1090" y="406" text-anchor="middle" font-size="10" fill="#3d6b1f">细则自动优化：N 份完成后触发并回写</text>

  <!-- Agent 层：行 y=490..554 -->
  <rect x="160" y="490" width="340" height="64" rx="6" fill="#e6f7f5" stroke="#13c2c2"/>
  <text x="330" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7a75">subjective/agents/ 五 Agent</text>
  <text x="330" y="536" text-anchor="middle" font-size="10" fill="#0e7a75">题目分析 · 答案提取 · 细则生成 · 评分 · 质量验证</text>

  <rect x="540" y="490" width="340" height="64" rx="6" fill="#e6f7f5" stroke="#13c2c2"/>
  <text x="710" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7a75">objective/ 客观题</text>
  <text x="710" y="536" text-anchor="middle" font-size="10" fill="#0e7a75">recognizer VLM 识别+自适应投票 · grader 比对</text>

  <rect x="920" y="490" width="340" height="64" rx="6" fill="#e6f7f5" stroke="#13c2c2"/>
  <text x="1090" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7a75">strategies · defenses · chem</text>
  <text x="1090" y="536" text-anchor="middle" font-size="10" fill="#0e7a75">学科自适应策略 · 注入防护 · 化学结构判等</text>

  <!-- 队列层：行 y=620..684 -->
  <rect x="160" y="620" width="340" height="64" rx="6" fill="#fff2e8" stroke="#fa541c"/>
  <text x="330" y="646" text-anchor="middle" font-size="13" font-weight="bold" fill="#ad3a00">task_manager.py 自研队列</text>
  <text x="330" y="666" text-anchor="middle" font-size="10" fill="#ad3a00">LIST + in-flight 凭据 + Lua CAS 状态机</text>

  <rect x="540" y="620" width="340" height="64" rx="6" fill="#fff2e8" stroke="#fa541c"/>
  <text x="710" y="646" text-anchor="middle" font-size="13" font-weight="bold" fill="#ad3a00">宕机恢复 · 退避重试</text>
  <text x="710" y="666" text-anchor="middle" font-size="10" fill="#ad3a00">巡检分布式锁 · RETRY_ZSET · 孤儿任务回收</text>

  <rect x="920" y="620" width="340" height="64" rx="6" fill="#fff2e8" stroke="#fa541c"/>
  <text x="1090" y="646" text-anchor="middle" font-size="13" font-weight="bold" fill="#ad3a00">MySQL outbox 双向对账</text>
  <text x="1090" y="666" text-anchor="middle" font-size="10" fill="#ad3a00">pending 行补投 · 终态 fence key 防重跑</text>

  <!-- 适配层：行 y=750..814 -->
  <rect x="160" y="750" width="340" height="64" rx="6" fill="#f9f0ff" stroke="#b37feb"/>
  <text x="330" y="776" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3fa0">provider_manager.py</text>
  <text x="330" y="796" text-anchor="middle" font-size="10" fill="#6b3fa0">4 个 Provider × MODEL_ROLES（17 个模型角色）</text>

  <rect x="540" y="750" width="340" height="64" rx="6" fill="#f9f0ff" stroke="#b37feb"/>
  <text x="710" y="776" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3fa0">subject_model_router.py</text>
  <text x="710" y="796" text-anchor="middle" font-size="10" fill="#6b3fa0">学科×角色三级 fallback + 学科级思考开关</text>

  <rect x="920" y="750" width="340" height="64" rx="6" fill="#f9f0ff" stroke="#b37feb"/>
  <text x="1090" y="776" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3fa0">core/ai/ 客户端族</text>
  <text x="1090" y="796" text-anchor="middle" font-size="10" fill="#6b3fa0">OpenAI 兼容 · Gemini 直连 · key 池轮询 · 熔断</text>

  <!-- 存储与外部：行 y=880..944 -->
  <rect x="160" y="880" width="340" height="64" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="330" y="906" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a">MySQL</text>
  <text x="330" y="926" text-anchor="middle" font-size="10" fill="#4a4a4a">终态主存 + 配置主存；连接失败拒绝启动</text>

  <rect x="540" y="880" width="340" height="64" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="710" y="906" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a">Redis</text>
  <text x="710" y="926" text-anchor="middle" font-size="10" fill="#4a4a4a">队列 · 缓存 · 配置投影；TTL 分层 30d/24h/7d</text>

  <rect x="920" y="880" width="340" height="64" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="1090" y="906" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a">MinIO/OSS · LLM×4</text>
  <text x="1090" y="926" text-anchor="middle" font-size="10" fill="#4a4a4a">图片对象存储；OpenRouter · Gemini · 千问 · 硅基</text>
</svg>
