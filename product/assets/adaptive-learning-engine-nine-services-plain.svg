<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" width="1322" height="965">
 <defs>
  <marker id="arrgray" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10">
   <path d="m0,0l10,5l-10,5l0,-10z" fill="#909399" id="svg_2"/>
  </marker>
 </defs>
 <!-- L6 决策/大脑层 -->
 <!-- L3 资产/仓库层 -->
 <!-- L2 事实记忆层 -->
 <!-- 简化的层间箭头：只画"大脑层->仓库层"和"大脑层->记忆事实层"和"仓库层内部"三组代表性箭头，避免过密交叉 -->
 <!-- 仓库层内部两条真实存在的边 -->
 <!-- 图例：精确清单 -->
 <g class="layer">
  <title>Layer 1</title>
  <text fill="#1f2d3d" font-size="22" font-weight="bold" id="svg_3" text-anchor="middle" x="660.75" y="21.5">九个服务怎么分工、怎么互相打电话</text>
  <text fill="#606266" font-size="12" id="svg_4" text-anchor="middle" x="660.75" y="44.5">箭头方向 = "谁去问谁"；只能从上层指向下层，下层永远不会主动问上层（本图不画具体连线，问询关系见下方完整清单）</text>
  <rect fill="#fef0f0" height="140" id="svg_5" rx="10" stroke="#f56c6c" stroke-width="1.5" width="1320" x="0.75" y="76.5"/>
  <text fill="#c0392b" font-size="13" font-weight="bold" id="svg_6" x="20.75" y="98.5">大脑层 —— 做判断、拍板决策</text>
  <rect fill="#ffffff" height="85" id="svg_7" rx="8" stroke="#f56c6c" stroke-width="1.5" width="280" x="40.75" y="116.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_8" text-anchor="middle" x="180.75" y="138.5">decision-svc（决策科）</text>
  <text fill="#606266" font-size="10.5" id="svg_9" text-anchor="middle" x="180.75" y="156.5">拍板"该给学生出什么题"</text>
  <text fill="#606266" font-size="10.5" id="svg_10" text-anchor="middle" x="180.75" y="172.5">问得最多的服务，是最终出口</text>
  <text fill="#909399" font-size="9" id="svg_11" text-anchor="middle" x="180.75" y="188.5">:8819</text>
  <rect fill="#ffffff" height="85" id="svg_12" rx="8" stroke="#f56c6c" stroke-width="1.5" width="280" x="370.75" y="116.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_13" text-anchor="middle" x="510.75" y="138.5">diagnosis-svc（诊断科）</text>
  <text fill="#606266" font-size="10.5" id="svg_14" text-anchor="middle" x="510.75" y="156.5">猜"学生到底哪里不会"</text>
  <text fill="#606266" font-size="10.5" id="svg_15" text-anchor="middle" x="510.75" y="172.5">给带证据、可反驳的判断</text>
  <text fill="#909399" font-size="9" id="svg_16" text-anchor="middle" x="510.75" y="188.5">:8818</text>
  <rect fill="#ffffff" height="85" id="svg_17" rx="8" stroke="#f56c6c" stroke-width="1.5" width="280" x="700.75" y="116.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_18" text-anchor="middle" x="840.75" y="138.5">profile-svc（状态判断科）</text>
  <text fill="#606266" font-size="10.5" id="svg_19" text-anchor="middle" x="840.75" y="156.5">算学生六个维度目前的状态</text>
  <text fill="#606266" font-size="10.5" id="svg_20" text-anchor="middle" x="840.75" y="172.5">自己不存数据，纯计算</text>
  <text fill="#909399" font-size="9" id="svg_21" text-anchor="middle" x="840.75" y="188.5">:8817</text>
  <rect fill="#f4f4f5" height="85" id="svg_22" rx="8" stroke="#909399" stroke-dasharray="4 3" width="260" x="1030.75" y="116.5"/>
  <text fill="#606266" font-size="10.5" id="svg_23" text-anchor="middle" x="1160.75" y="144.5">这三个大脑服务</text>
  <text fill="#606266" font-size="10.5" id="svg_24" text-anchor="middle" x="1160.75" y="160.5">互相之间也会问一点点</text>
  <text fill="#909399" font-size="9.5" id="svg_25" text-anchor="middle" x="1160.75" y="178.5">（明细见下方清单第1-2条）</text>
  <rect fill="#fffbe6" height="140" id="svg_26" rx="10" stroke="#e6a23c" stroke-width="1.5" width="1320" x="0.75" y="266.5"/>
  <text fill="#ad6800" font-size="13" font-weight="bold" id="svg_27" x="20.75" y="288.5">仓库层 —— 管教学资料，像四个仓库管理员</text>
  <rect fill="#ffffff" height="85" id="svg_28" rx="8" stroke="#e6a23c" stroke-width="1.5" width="290" x="40.75" y="306.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_29" text-anchor="middle" x="185.75" y="328.5">kp-svc（知识点科）</text>
  <text fill="#606266" font-size="10.5" id="svg_30" text-anchor="middle" x="185.75" y="346.5">管考点：是什么、挂教材哪一节</text>
  <text fill="#909399" font-size="9" id="svg_31" text-anchor="middle" x="185.75" y="362.5">:8813 · 被问得最多</text>
  <rect fill="#ffffff" height="85" id="svg_32" rx="8" stroke="#e6a23c" stroke-width="1.5" width="290" x="360.75" y="306.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_33" text-anchor="middle" x="505.75" y="328.5">item-svc（题目科）</text>
  <text fill="#606266" font-size="10.5" id="svg_34" text-anchor="middle" x="505.75" y="346.5">管题库：题目内容、考什么、能否推给学生</text>
  <text fill="#909399" font-size="9" id="svg_35" text-anchor="middle" x="505.75" y="362.5">:8814</text>
  <rect fill="#f4f4f5" height="85" id="svg_36" rx="8" stroke="#909399" stroke-dasharray="4 3" width="290" x="680.75" y="306.5"/>
  <text fill="#606266" font-size="14" font-weight="bold" id="svg_37" text-anchor="middle" x="825.75" y="328.5">rubric-svc（评分标准科）</text>
  <text fill="#909399" font-size="10" id="svg_38" text-anchor="middle" x="825.75" y="346.5">管评分规则(只读镜像自批阅系统)</text>
  <text fill="#c0392b" font-size="9.5" id="svg_39" text-anchor="middle" x="825.75" y="362.5">:8815 · 目前没有其他服务问它</text>
  <rect fill="#ffffff" height="85" id="svg_40" rx="8" stroke="#e6a23c" stroke-width="1.5" width="290" x="1000.75" y="306.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_41" text-anchor="middle" x="1145.75" y="328.5">misconception-svc（错误类型科）</text>
  <text fill="#606266" font-size="10.5" id="svg_42" text-anchor="middle" x="1145.75" y="346.5">管学生常见的错误想法清单</text>
  <text fill="#909399" font-size="9" id="svg_43" text-anchor="middle" x="1145.75" y="362.5">:8816</text>
  <rect fill="#e6fffb" height="130" id="svg_44" rx="10" stroke="#13c2c2" stroke-width="1.5" width="1320" x="0.75" y="456.5"/>
  <text fill="#08979c" font-size="13" font-weight="bold" id="svg_45" x="20.75" y="478.5">事实与记忆层 —— 打底的两个服务，专门存东西，不做判断</text>
  <rect fill="#ffffff" height="75" id="svg_46" rx="8" stroke="#13c2c2" stroke-width="1.5" width="400" x="160.75" y="496.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_47" text-anchor="middle" x="360.75" y="518.5">evidence-svc（事实科）</text>
  <text fill="#606266" font-size="10.5" id="svg_48" text-anchor="middle" x="360.75" y="536.5">存原始作答记录，永不改永不删；是全系统的地基</text>
  <text fill="#909399" font-size="9" id="svg_49" text-anchor="middle" x="360.75" y="552.5">:8811 · 不问任何其他服务</text>
  <rect fill="#ffffff" height="75" id="svg_50" rx="8" stroke="#13c2c2" stroke-width="1.5" width="400" x="760.75" y="496.5"/>
  <text fill="#1f2d3d" font-size="14" font-weight="bold" id="svg_51" text-anchor="middle" x="960.75" y="518.5">memory-svc（记忆科）</text>
  <text fill="#606266" font-size="10.5" id="svg_52" text-anchor="middle" x="960.75" y="536.5">存学生六维度状态的时间序列卡；只加新记录不改旧记录</text>
  <text fill="#909399" font-size="9" id="svg_53" text-anchor="middle" x="960.75" y="552.5">:8812 · 只有profile-svc能写</text>
  <line id="svg_54" marker-end="url(#arrgray)" stroke="#c0c4cc" x1="1160.75" x2="1160.75" y1="216.5" y2="266.5"/>
  <text fill="#c0c4cc" font-size="9" id="svg_55" x="1170.75" y="244.5">大脑层整体问仓库层</text>
  <line id="svg_56" marker-end="url(#arrgray)" stroke="#c0c4cc" x1="1160.75" x2="1160.75" y1="406.5" y2="456.5"/>
  <text fill="#c0c4cc" font-size="9" id="svg_57" x="1170.75" y="434.5">大脑层整体问记忆/事实层</text>
  <line id="svg_58" marker-end="url(#arrgray)" stroke="#909399" stroke-width="1.3" x1="360.75" x2="330.75" y1="391.5" y2="391.5"/>
  <text fill="#909399" font-size="8.5" id="svg_59" text-anchor="middle" x="345.75" y="404.5">item问kp</text>
  <line id="svg_60" marker-end="url(#arrgray)" stroke="#909399" stroke-width="1.3" x1="1000.75" x2="650.75" y1="391.5" y2="391.5"/>
  <text fill="#909399" font-size="8.5" id="svg_61" text-anchor="middle" x="825.75" y="404.5">misconception问item</text>
  <rect fill="#f4f4f5" height="355" id="svg_62" rx="10" stroke="#909399" width="1320" x="0.75" y="606.5"/>
  <text fill="#1f2d3d" font-size="13" font-weight="bold" id="svg_63" x="20.75" y="631.5">谁问谁 · 完整清单（来自服务契约 §4.1，逐条列全，不多不少）</text>
  <text fill="#c0392b" font-size="11" font-weight="bold" id="svg_64" x="20.75" y="660.5">1. decision-svc 问：</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_65" x="30.75" y="678.5">item-svc（要候选题）· memory-svc（要学生状态，只读）· diagnosis-svc（要当前诊断，只读）</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_66" x="30.75" y="694.5">profile-svc（班级场景临时算状态，只读，不写库）· kp-svc（核对考点是否存在）</text>
  <text fill="#c0392b" font-size="11" font-weight="bold" id="svg_67" x="20.75" y="720.5">2. diagnosis-svc 问：</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_68" x="30.75" y="738.5">evidence-svc（要作答证据，只读）· item-svc（要题目角色信息）· memory-svc（要学生状态，只读）</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_69" x="30.75" y="754.5">kp-svc（核对考点）· misconception-svc（核对错误类型名称对不对）</text>
  <text fill="#c0392b" font-size="11" font-weight="bold" id="svg_70" x="20.75" y="780.5">3. profile-svc 问：</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_71" x="30.75" y="798.5">evidence-svc（要原始作答，只读，是六轴计算唯一依据）· memory-svc（写入新状态 + 读上一版状态）</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_72" x="30.75" y="814.5">item-svc（要题目挂载信息）· kp-svc（核对考点）</text>
  <text fill="#1f2d3d" font-size="11" font-weight="bold" id="svg_73" x="20.75" y="840.5">4. item-svc 问：</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_74" x="30.75" y="856.5">kp-svc（挂载题目时核对考点是否存在）</text>
  <text fill="#1f2d3d" font-size="11" font-weight="bold" id="svg_75" x="20.75" y="880.5">5. misconception-svc 问：</text>
  <text fill="#1f2d3d" font-size="10.5" id="svg_76" x="30.75" y="896.5">item-svc（写干扰项映射时核对题目是否存在）</text>
  <text fill="#c0392b" font-size="10.5" font-weight="bold" id="svg_77" x="20.75" y="920.5">evidence-svc、memory-svc 不问任何其他服务——它们是全系统的"地基"，只被别人问，不主动问别人</text>
  <text fill="#c0392b" font-size="10.5" font-weight="bold" id="svg_78" x="20.75" y="938.5">rubric-svc 目前没有被任何服务问过——它已经建好、能独立使用，但还没接入其他服务的判断链路</text>
 </g>
</svg>