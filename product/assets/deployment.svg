<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#606266"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#909399"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="750" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">IndieVolve AI 批阅系统 — 部署架构图</text>

  <!-- 三个区域 -->
  <rect x="30" y="60" width="560" height="760" rx="10" fill="#f4f4f5" stroke="#909399" stroke-dasharray="8 5"/>
  <rect x="640" y="60" width="490" height="760" rx="10" fill="#ecf5ff" stroke="#79bbff" stroke-dasharray="8 5"/>
  <rect x="1180" y="60" width="290" height="760" rx="10" fill="#fdf6ec" stroke="#e6a23c" stroke-dasharray="8 5"/>
  <text x="48" y="92" font-size="14" font-weight="bold" fill="#606266">学校侧（边缘部署）</text>
  <text x="658" y="92" font-size="14" font-weight="bold" fill="#1f6fb5">阿里云 · 中心云（双可用区）</text>
  <text x="1198" y="92" font-size="14" font-weight="bold" fill="#b88230">外部依赖</text>

  <!-- 学校侧：设备 -->
  <rect x="60" y="120" width="220" height="55" rx="6" fill="#ffffff" stroke="#606266"/>
  <text x="170" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">高速扫描仪</text>
  <text x="170" y="163" text-anchor="middle" font-size="11" fill="#606266">物理扫描 100 份/分钟</text>

  <rect x="60" y="195" width="220" height="75" rx="6" fill="#ffffff" stroke="#606266"/>
  <text x="170" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">批阅一体机</text>
  <text x="170" y="235" text-anchor="middle" font-size="11" fill="#606266">Win10 触屏 · 扫描 ≤50 份</text>
  <text x="170" y="251" text-anchor="middle" font-size="11" fill="#606266">打印 ≤350 张 · NFC · GPS · 4G</text>

  <rect x="60" y="290" width="220" height="50" rx="6" fill="#ffffff" stroke="#606266"/>
  <text x="170" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">打印机</text>
  <text x="170" y="329" text-anchor="middle" font-size="11" fill="#606266">批阅留痕打印</text>

  <rect x="340" y="180" width="220" height="120" rx="6" fill="#ffffff" stroke="#606266" stroke-width="1.5"/>
  <text x="450" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">设备端软件（设备网关）</text>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#606266">SDK 驱动 · 姿态矫正 · PDF 合成</text>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#606266">扫描上传 · 留痕打印下发</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#606266">OTA 版本管理 · 远程监控</text>

  <!-- 教师终端组 -->
  <rect x="60" y="640" width="500" height="120" rx="6" fill="#ffffff" stroke="#606266" stroke-dasharray="5 4"/>
  <text x="75" y="663" font-size="13" font-weight="bold" fill="#1f2d3d">教师终端（多端接入）</text>
  <rect x="80" y="680" width="140" height="55" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="150" y="703" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">微信小程序</text>
  <text x="150" y="721" text-anchor="middle" font-size="10" fill="#909399">已正式发版</text>
  <rect x="240" y="680" width="140" height="55" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="310" y="703" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">iOS · Android</text>
  <text x="310" y="721" text-anchor="middle" font-size="10" fill="#909399">uni-app 一端多出</text>
  <rect x="400" y="680" width="140" height="55" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="470" y="703" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">Web 浏览器</text>
  <text x="470" y="721" text-anchor="middle" font-size="10" fill="#909399">触屏适配 · 三套环境</text>

  <!-- 云端 -->
  <rect x="775" y="120" width="220" height="45" rx="6" fill="#ffffff" stroke="#409eff" stroke-width="1.5"/>
  <text x="885" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">ALB 负载均衡</text>

  <rect x="670" y="200" width="430" height="140" rx="8" fill="#ffffff" stroke="#409eff" stroke-dasharray="5 4"/>
  <text x="685" y="222" font-size="13" font-weight="bold" fill="#1f6fb5">批阅系统（学校租户面：考试 / 批阅 / 讲评）</text>
  <rect x="690" y="235" width="240" height="50" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="810" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">后端 × 2</text>
  <text x="810" y="275" text-anchor="middle" font-size="10" fill="#606266">负载均衡（ECS 16C32G · 弹性伸缩）</text>
  <rect x="950" y="235" width="130" height="50" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="1015" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">同步 Worker</text>
  <text x="1015" y="275" text-anchor="middle" font-size="10" fill="#606266">×1 · 结果回拉</text>

  <rect x="775" y="380" width="220" height="45" rx="6" fill="#ffffff" stroke="#409eff"/>
  <text x="885" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">预处理服务（试卷预处理）</text>

  <rect x="670" y="465" width="430" height="160" rx="8" fill="#ffffff" stroke="#409eff" stroke-dasharray="5 4"/>
  <text x="685" y="487" font-size="13" font-weight="bold" fill="#1f6fb5">批阅服务（内部，不对外开放）</text>
  <rect x="775" y="505" width="220" height="45" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="885" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">后端 × 1（任务接入）</text>
  <rect x="775" y="560" width="220" height="45" rx="6" fill="#ecf5ff" stroke="#409eff"/>
  <text x="885" y="580" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">批阅 Worker × 3</text>
  <text x="885" y="598" text-anchor="middle" font-size="10" fill="#606266">并发批阅 50–75 份/分钟</text>

  <rect x="670" y="655" width="240" height="55" rx="6" fill="#ffffff" stroke="#409eff"/>
  <text x="790" y="677" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">RDS MySQL</text>
  <text x="790" y="695" text-anchor="middle" font-size="10" fill="#606266">双可用区 · 15 天备份</text>
  <rect x="670" y="720" width="240" height="55" rx="6" fill="#ffffff" stroke="#409eff"/>
  <text x="790" y="742" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">云数据库 Redis</text>
  <text x="790" y="760" text-anchor="middle" font-size="10" fill="#606266">双可用区</text>

  <!-- 外部依赖 -->
  <rect x="1200" y="300" width="240" height="95" rx="6" fill="#ffffff" stroke="#e6a23c" stroke-width="1.5"/>
  <text x="1320" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">千问 3.7 Plus 大模型</text>
  <text x="1320" y="347" text-anchor="middle" font-size="11" fill="#606266">分学科自定义模型 + 评分细则</text>
  <text x="1320" y="365" text-anchor="middle" font-size="11" fill="#606266">语文 / 数学开启思考模式</text>
  <text x="1320" y="383" text-anchor="middle" font-size="10" fill="#909399">客观 100% · 主观 95.4%（样本库）</text>

  <rect x="1200" y="500" width="240" height="85" rx="6" fill="#ffffff" stroke="#e6a23c"/>
  <text x="1320" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">华为云 OBS</text>
  <text x="1320" y="547" text-anchor="middle" font-size="11" fill="#606266">华汉云历史答题卡原图</text>
  <text x="1320" y="565" text-anchor="middle" font-size="11" fill="#606266">数据迁移源（16 并发下载）</text>

  <!-- 连线：学校侧内部 -->
  <path d="M280,147 H310 V205 H340" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M280,232 H340" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M340,265 H310 V315 H280" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 连线：上传与访问 -->
  <path d="M450,180 V142 H775" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="132" text-anchor="middle" font-size="11" fill="#606266">上传答题卡 PDF（HTTPS）</text>
  <path d="M560,700 H643 V152 H775" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="618" y="420" font-size="11" fill="#909399" transform="rotate(-90 618 420)" text-anchor="middle">教师多端访问（HTTPS）</text>

  <!-- 连线：云端主链路 -->
  <path d="M885,165 V235" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M810,285 V380" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="818" y="362" font-size="10" fill="#909399">试卷预处理</text>
  <path d="M885,425 V505" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="893" y="470" font-size="10" fill="#909399">批阅请求</text>
  <path d="M885,550 V560" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M830,605 V655" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="838" y="635" font-size="10" fill="#909399">结果入库</text>

  <!-- 连线：数据库总线 -->
  <path d="M690,260 H657 V682 H670" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M657,682 V747 H670" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="672" y="648" font-size="10" fill="#909399">考试 / 成绩 / 题库</text>

  <!-- 连线：外部依赖 -->
  <path d="M995,582 H1140 V347 H1200" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1068" y="572" text-anchor="middle" font-size="10" fill="#909399">LLM API 调用</text>
  <path d="M1015,285 V527 H995" fill="none" stroke="#909399" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="1023" y="400" font-size="10" fill="#909399">结果同步</text>
  <path d="M1200,542 H1155 V270 H1100" fill="none" stroke="#909399" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="1172" y="410" font-size="10" fill="#909399" transform="rotate(-90 1172 410)" text-anchor="middle">历史数据迁移</text>

  <!-- 图例 -->
  <path d="M60,845 H100" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="108" y="849" font-size="10" fill="#606266">业务调用</text>
  <path d="M190,845 H230" fill="none" stroke="#909399" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="238" y="849" font-size="10" fill="#909399">数据同步 / 迁移</text>
</svg>
