<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="920" viewBox="0 0 1420 920" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#606266"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#409eff"/>
    </marker>
  </defs>

  <text x="710" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">Indievolve 数据资产分层架构（提案）</text>

  <!-- 行标签：统一 x=40，纵向居中于该行方框 -->
  <text x="40" y="124" font-size="13" font-weight="bold" fill="#909399">L0 元数据锚点</text>
  <text x="40" y="249" font-size="13" font-weight="bold" fill="#909399">L1 知识图谱</text>
  <text x="40" y="394" font-size="13" font-weight="bold" fill="#909399">L2 内容资产层</text>
  <text x="40" y="559" font-size="13" font-weight="bold" fill="#909399">存储与中间件</text>
  <text x="40" y="704" font-size="13" font-weight="bold" fill="#909399">L3 消费层</text>

  <!-- L0：左边界统一 x=160 -->
  <rect x="160" y="90" width="340" height="60" rx="6" fill="#ffffff" stroke="#606266"/>
  <text x="330" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">教材版本管理</text>
  <text x="330" y="136" text-anchor="middle" font-size="10" fill="#606266">分地区/分版本（如定西用某版本）</text>

  <rect x="540" y="90" width="340" height="60" rx="6" fill="#ffffff" stroke="#606266"/>
  <text x="710" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">考纲 / 教学大纲</text>
  <text x="710" y="136" text-anchor="middle" font-size="10" fill="#606266">2025 教学大纲等，含版本</text>

  <path d="M330,150 V210" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M710,150 V210" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L1：与 L0 共享 x=160..880 -->
  <rect x="160" y="210" width="720" height="70" rx="8" fill="#ecf5ff" stroke="#409eff" stroke-width="1.5"/>
  <text x="520" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6fb5">知识点图谱</text>
  <text x="520" y="260" text-anchor="middle" font-size="11" fill="#1f6fb5">知识点 ↔ 考点 ↔ 教材章节 · 关联关系</text>

  <path d="M320,280 V340" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M720,280 V340" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L2：内容资产层 -->
  <rect x="160" y="340" width="320" height="100" rx="6" fill="#ffffff" stroke="#606266" stroke-width="1.5"/>
  <text x="320" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">试卷库（全国公共）</text>
  <text x="320" y="386" text-anchor="middle" font-size="10" fill="#606266">PDF 切分 → 结构化入库</text>
  <text x="320" y="404" text-anchor="middle" font-size="10" fill="#606266">AI 校正 →（新增）人工复核</text>
  <text x="320" y="422" text-anchor="middle" font-size="9" fill="#909399">现状：6 套元数据错误 · 无人工校正</text>

  <rect x="560" y="340" width="320" height="100" rx="6" fill="#ffffff" stroke="#606266" stroke-width="1.5"/>
  <text x="720" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">校本库（学校私有）</text>
  <text x="720" y="386" text-anchor="middle" font-size="10" fill="#606266">教师上传 → 教研组长初审</text>
  <text x="720" y="404" text-anchor="middle" font-size="10" fill="#606266">→ 教务处终审（记名留痕）</text>
  <text x="720" y="422" text-anchor="middle" font-size="9" fill="#909399">现状：已实现两级审核，运行中</text>

  <path d="M480,388 H560" fill="none" stroke="#409eff" stroke-width="1.5" marker-end="url(#arr2)" marker-start="url(#arr2)"/>
  <text x="520" y="352" text-anchor="middle" font-size="9" fill="#1f6fb5">知识点标签</text>
  <text x="520" y="364" text-anchor="middle" font-size="9" fill="#1f6fb5">双向打通</text>

  <!-- L2 -> 存储与中间件 总线 -->
  <path d="M320,440 V470" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M720,440 V470" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M160,470 H1290" fill="none" stroke="#606266" stroke-width="1.5"/>
  <text x="170" y="463" font-size="10" fill="#909399">落盘 / 持久化</text>
  <path d="M265,470 V500" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M495,470 V500" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M725,470 V500" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M955,470 V500" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M1185,470 V500" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 存储与中间件层：5 个组件，含选型原因 -->
  <rect x="160" y="500" width="210" height="110" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="265" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">对象存储（OSS / S3）</text>
  <text x="265" y="540" text-anchor="middle" font-size="9" fill="#606266">原始 PDF · 答题卡扫描图</text>
  <text x="265" y="556" text-anchor="middle" font-size="9" fill="#606266">课件 / 讲义导出文件</text>
  <text x="265" y="574" text-anchor="middle" font-size="8" fill="#5a9216">原因：非结构化大文件 · 低成本持久化</text>

  <rect x="390" y="500" width="210" height="110" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="495" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">关系数据库（RDS MySQL）</text>
  <text x="495" y="540" text-anchor="middle" font-size="9" fill="#606266">题目元数据 · 知识点关系</text>
  <text x="495" y="556" text-anchor="middle" font-size="9" fill="#606266">审核记录 · 用户与权限</text>
  <text x="495" y="574" text-anchor="middle" font-size="8" fill="#5a9216">原因：强一致性事务 · 关系型查询</text>

  <rect x="620" y="500" width="210" height="110" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="725" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">缓存（Redis）</text>
  <text x="725" y="540" text-anchor="middle" font-size="9" fill="#606266">会话 · 权限 · 热点配置</text>
  <text x="725" y="556" text-anchor="middle" font-size="9" fill="#606266">（已用于批阅系统部署）</text>
  <text x="725" y="574" text-anchor="middle" font-size="8" fill="#5a9216">原因：低延迟高频读 · 减轻主库压力</text>

  <rect x="850" y="500" width="210" height="110" rx="6" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="955" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">OLAP 引擎（ClickHouse）</text>
  <text x="955" y="540" text-anchor="middle" font-size="9" fill="#606266">学情 · 教学质量指标</text>
  <text x="955" y="556" text-anchor="middle" font-size="9" fill="#606266">增值指数 · 考点热力图</text>
  <text x="955" y="574" text-anchor="middle" font-size="8" fill="#5a9216">原因：高基数多维聚合 · MySQL 不擅长</text>

  <rect x="1080" y="500" width="210" height="110" rx="6" fill="#f0f9eb" stroke="#67c23a" stroke-dasharray="4 3"/>
  <text x="1185" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d3d">向量检索（可选）</text>
  <text x="1185" y="540" text-anchor="middle" font-size="9" fill="#606266">相似题查重 · 语义检索</text>
  <text x="1185" y="556" text-anchor="middle" font-size="9" fill="#606266">（Milvus / pgvector 等）</text>
  <text x="1185" y="574" text-anchor="middle" font-size="8" fill="#5a9216">原因：语义相似度匹配，关系库不擅长</text>

  <!-- 存储 -> L3 总线 -->
  <path d="M265,610 V630" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M495,610 V630" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M725,610 V630" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M955,610 V630" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M1185,610 V630" fill="none" stroke="#606266" stroke-width="1.5"/>
  <path d="M160,630 H1290" fill="none" stroke="#606266" stroke-width="1.5"/>
  <text x="170" y="623" font-size="10" fill="#909399">统一 API 消费（不各自维护副本）</text>

  <path d="M250,630 V660" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M458,630 V660" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M666,630 V660" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M874,630 V660" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M1082,630 V660" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M1290,630 V660" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L3 消费层 -->
  <rect x="160" y="660" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="250" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">命题组卷</text>
  <text x="250" y="712" text-anchor="middle" font-size="10" fill="#606266">考试</text>

  <rect x="368" y="660" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="458" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">备课</text>
  <text x="458" y="712" text-anchor="middle" font-size="10" fill="#606266">AI 教案 / 课件</text>

  <rect x="576" y="660" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="666" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">批阅服务</text>
  <text x="666" y="712" text-anchor="middle" font-size="10" fill="#606266">评分细则匹配</text>

  <rect x="784" y="660" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="874" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">讲评</text>
  <text x="874" y="712" text-anchor="middle" font-size="10" fill="#606266">AI 重灾题生成</text>

  <rect x="992" y="660" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="1082" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">提分 / 学情</text>
  <text x="1082" y="712" text-anchor="middle" font-size="10" fill="#606266">考点掌握分析</text>

  <rect x="1200" y="660" width="180" height="80" rx="6" fill="#f4f4f5" stroke="#909399"/>
  <text x="1290" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d3d">教学质量 / 校园空间</text>
  <text x="1290" y="712" text-anchor="middle" font-size="10" fill="#606266">薄弱考点热力图</text>

  <!-- 内容治理 -->
  <rect x="160" y="790" width="1130" height="55" rx="6" fill="#fdf6ec" stroke="#e6a23c" stroke-dasharray="5 4"/>
  <text x="725" y="812" text-anchor="middle" font-size="12" font-weight="bold" fill="#b88230">内容治理（跨层）</text>
  <text x="725" y="830" text-anchor="middle" font-size="11" fill="#8a6d3b">专职复核人员 · 版本管理 · 审核留痕（校本库两级审核 / 全国库人工复核）</text>

  <!-- 图例 -->
  <path d="M160,875 H200" fill="none" stroke="#606266" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="208" y="879" font-size="10" fill="#606266">数据流向 / API 调用</text>
  <path d="M400,875 H440" fill="none" stroke="#409eff" stroke-width="1.5" marker-end="url(#arr2)" marker-start="url(#arr2)"/>
  <text x="448" y="879" font-size="10" fill="#1f6fb5">知识点标签双向打通</text>
  <rect x="700" y="867" width="30" height="16" fill="#f0f9eb" stroke="#67c23a"/>
  <text x="738" y="879" font-size="10" fill="#5a9216">存储 / 中间件（绿色=已选型，虚线=可选）</text>
  <rect x="1080" y="867" width="30" height="16" fill="#fdf6ec" stroke="#e6a23c" stroke-dasharray="4 3"/>
  <text x="1118" y="879" font-size="10" fill="#b88230">治理范围（跨层）</text>
</svg>
