 <text x="890" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">自适应学习引擎（全量实验室-v2）运行时权威进程视图</text>
 <text x="890" y="50" text-anchor="middle" font-size="11.5" fill="#606266">全部 15 个进程 · 仅监听 127.0.0.1 · 端口取自 engine/frozen_v3.yaml + engine/config/services.d/*.yaml · 路径均相对 engine/ 根目录</text>
 <text x="890" y="68" text-anchor="middle" font-size="10" font-style="italic" fill="#909399">启动顺序=依赖顺序(自底向上)：数据层 → 九领域微服务(svcctl管理) → 网关/身份/BFF层(boot-all管理) → 浏览器客户端</text>

 <!-- ================= LAYER 0: 浏览器客户端 ================= -->
 <rect x="40" y="88" width="1700" height="70" rx="8" fill="#f4f4f5" stroke="#909399" stroke-dasharray="6 4"/>
 <text x="60" y="108" font-size="11" font-weight="bold" fill="#606266">浏览器客户端（静态资源由 static-pages 进程托管，非独立 Node 进程）</text>
 <rect x="80" y="118" width="360" height="30" rx="4" fill="#ffffff" stroke="#909399"/>
 <text x="260" y="138" text-anchor="middle" font-size="10" fill="#1f2d3d">teacher-web（React SPA，构建产物）</text>
 <text x="470" y="138" font-size="9.5" fill="#606266">engine/teacher-web/dist/（`npm run build` 产物，由 static-pages 服务托管）</text>

