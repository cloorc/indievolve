 <rect x="335" y="638" width="245" height="70" rx="6" fill="#ffffff" stroke="#67c23a"/>
 <text x="457" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f2d3d">diagnosis-svc :8818</text>
 <text x="457" y="670" text-anchor="middle" font-size="8.5" fill="#606266">services/diagnosis_svc/app.py</text>
 <text x="457" y="683" text-anchor="middle" font-size="8.5" fill="#909399">order=80 · 861行·8端点</text>
 <text x="457" y="696" text-anchor="middle" font-size="8" fill="#909399">L5 诊断假设集+状态机</text>

 <rect x="590" y="638" width="270" height="70" rx="6" fill="#ffffff" stroke="#67c23a" stroke-width="1.5"/>
 <text x="725" y="655" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f2d3d">decision-svc :8819</text>
 <text x="725" y="670" text-anchor="middle" font-size="8.5" fill="#606266">services/decision_svc/app.py</text>
 <text x="725" y="683" text-anchor="middle" font-size="8.5" fill="#909399">order=90 · 1478行·6端点</text>
 <text x="725" y="696" text-anchor="middle" font-size="8" fill="#c0392b">L6 决策路由+选题+聚类，按记忆类备份</text>

 <text x="60" y="740" font-size="9" font-style="italic" fill="#3c8618">九服务共用一把 API key（.ale/engine_api_key，0600），服务间仅经 HTTP 互通，_shared/client.py 按已登记出站边在运行时拦截越权调用</text>
 <text x="60" y="755" font-size="9" font-style="italic" fill="#3c8618">启动顺序=依赖顺序：被调方必须先起（evidence→memory→kp/item/rubric/misconception→profile→diagnosis→decision），否则启动期健康探测会失败</text>

 <!-- ================= LAYER 3: 数据层 ================= -->
 <rect x="40" y="778" width="1700" height="120" rx="8" fill="#fef0f0" stroke="#f56c6c" stroke-dasharray="6 4"/>
 <text x="60" y="798" font-size="11" font-weight="bold" fill="#c0392b">数据层</text>
 <rect x="80" y="808" width="500" height="75" rx="6" fill="#ffffff" stroke="#f56c6c"/>
 <text x="330" y="828" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f2d3d">PostgreSQL 16 :5433（非默认5432）</text>
 <text x="330" y="844" text-anchor="middle" font-size="9" fill="#606266">数据目录：$HOME/pgdata（ALE_PGDATA 可覆盖）</text>
 <text x="330" y="858" text-anchor="middle" font-size="9" fill="#606266">socket：$HOME/pgsock（ALE_PGHOST 可覆盖）</text>
 <text x="330" y="872" text-anchor="middle" font-size="9" fill="#909399">dbname=ale_engine，schema=ale，23张表，14次迁移(engine/migrations/pg/)</text>

 <rect x="600" y="808" width="500" height="75" rx="6" fill="#ffffff" stroke="#f56c6c"/>
 <text x="850" y="828" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f2d3d">engine/policies/policies.yaml</text>
 <text x="850" y="844" text-anchor="middle" font-size="9" fill="#606266">decision-svc 唯一只读，非数据库表</text>
 <text x="850" y="858" text-anchor="middle" font-size="9" fill="#606266">3 条策略场景 + weights，禁调用方传</text>
 <text x="850" y="872" text-anchor="middle" font-size="9" fill="#909399">修改此文件须同步升 policy_version</text>

 <rect x="1120" y="808" width="600" height="75" rx="6" fill="#ffffff" stroke="#f56c6c"/>
 <text x="1420" y="828" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f2d3d">engine/frozen_v3.yaml + config/services.d/*.yaml</text>
 <text x="1420" y="844" text-anchor="middle" font-size="9" fill="#606266">唯一权威枚举源 + 15 个服务描述符（name/module/port/order/manager）</text>
 <text x="1420" y="858" text-anchor="middle" font-size="9" fill="#909399">进程管理靠 tools/svcctl.py（九服务）+ tools/boot_all.sh（全链，含PG/网关/BFF）</text>

 <text x="60" y="898" font-size="9" font-style="italic" fill="#c0392b">数据层为九服务提供底层存储/策略/服务发现依据（PostgreSQL 被全部九服务读写；policies.yaml 仅 decision-svc 只读）；图中省略与九服务的连线以避免遮挡上方方框</text>

 <!-- ================= Deployment/process management notes ================= -->
 <rect x="40" y="918" width="1700" height="145" rx="8" fill="#fff7e6" stroke="#e6a23c" stroke-dasharray="6 4"/>
 <text x="890" y="941" text-anchor="middle" font-size="12" font-weight="bold" fill="#ad6800">进程管理与部署现状（tools/svcctl.py 注释原文）</text>
 <text x="60" y="963" font-size="9.5" fill="#606266">· 无 systemd（服务器账号不在 sudoers），用 crontab @reboot 做开机自启（不需要 root），不做自动重启守护——进程崩溃时如实报告，不自动拉起掩盖故障</text>
 <text x="60" y="982" font-size="9.5" fill="#606266">· 就绪判据 = healthz 返回且 data.db=="ok"（而非"有响应即就绪"——曾出现"九进程活着但业务端点全503"被误记为启动成功的真实事故）</text>
 <text x="60" y="1001" font-size="9.5" fill="#606266">· 正式模式为 caller-edge-v1：每条已登记出站边独立随机凭据，进程只取得自己的 0600 主体材料文件；shared-loopback 仅供历史测试迁移，正式启动不会静默选用</text>
 <text x="60" y="1020" font-size="9.5" fill="#606266">· 服务器状态（截至 §5.3.3）：本地候选已通过 3732/3732 测试 + 102/102 全链验收，但 08-18 因服务器 SSH 被阻断（TCP可达但协议握手前断开），尚未完成生产环境部署验收</text>
 <text x="60" y="1043" font-size="9" font-style="italic" fill="#ad6800">全部端口/模块路径信息来自本地代码实测（engine/frozen_v3.yaml + engine/config/services.d/*.yaml + engine/tools/boot_all.sh + engine/tools/svcctl.py），非文档转述</text>

