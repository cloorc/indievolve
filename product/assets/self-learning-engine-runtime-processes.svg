 <text x="60" y="428" font-size="11" font-weight="bold" fill="#3c8618">九个领域微服务层 —— manager: svcctl（engine/tools/svcctl.py 独立进程管理，启动顺序=依赖DAG自底向上）</text>

 <!-- L2 row -->
 <text x="60" y="450" font-size="9.5" font-weight="bold" fill="#606266">L2 事实层（service_class=memory，不可重算，必须备份）</text>
 <rect x="80" y="458" width="380" height="60" rx="6" fill="#ffffff" stroke="#67c23a"/>
 <text x="270" y="475" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f2d3d">evidence-svc :8811</text>
